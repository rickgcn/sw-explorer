[workspace]
members = [
    "crates/sw-cli",
    "crates/sw-core"
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["rickgcn"]

[workspace.dependencies]
sw-core = { path = "crates/sw-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
