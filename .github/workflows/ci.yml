# Keep CI on explicit OS generations.
# Avoid *-latest so hosted-runner migrations do not silently
# change the project's supported build baseline.

name: CI

on:
  push:
    branches:
      - v2

  pull_request:
    branches:
      - v2

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust 1.95.0
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache: true
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build release
        run: cargo build --workspace --release --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust 1.95.0
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.95.0
          cache: true
          rustflags: ""

      - name: Run tests
        run: cargo test --workspace --locked

  gui-build:
    name: GUI Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust 1.95.0
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.95.0
          cache: true
          rustflags: ""

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.3'
          cache: true

      - name: Install cxxbridge-cmd 1.0.199
        run: cargo install cxxbridge-cmd --version 1.0.199 --locked

      - name: Configure
        run: cmake -S apps/sw-explorer -B build/sw-explorer -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/sw-explorer --config Release --parallel
